services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: kyokushin
      POSTGRES_USER: kyokushin
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyokushin -d kyokushin"]
      interval: 5s
      retries: 12
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SERVER_ADDRESS: 0.0.0.0
      DB_URL: jdbc:postgresql://db:5432/kyokushin
      DB_USER: kyokushin
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
